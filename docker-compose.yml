services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: actions
      DB_USER: actions
      DB_PASSWORD: actions
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: actions
      POSTGRES_USER: actions
      POSTGRES_PASSWORD: actions
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les scripts SQL de migrations/ sont exécutés à la première création de la base.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actions -d actions"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
